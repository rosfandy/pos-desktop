name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Create Tag & Build + Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Extract version
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Version: $ver"

          # Buat & push git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$ver" -m "Release $ver" 2>$null
          git push origin "v$ver" 2>$null

          # Build & publish
          npx electron-builder --win --publish always

          # Upload latest.yml untuk auto-updater
          $ver = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $yml = Get-ChildItem release -Filter "latest*.yml" | Select-Object -First 1
          if ($yml) {
            Write-Host "Uploading $($yml.Name) to release $ver"
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rosfandy/pos-desktop/releases/tags/$ver" -Headers $headers
            $bytes = [System.IO.File]::ReadAllBytes($yml.FullName)
            Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/rosfandy/pos-desktop/releases/$($release.id)/assets?name=$($yml.Name)" -Headers $headers -ContentType "application/octet-stream" -Body $bytes
          }
