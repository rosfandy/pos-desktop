name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Git Tag
        id: tag
        run: |
          $ver = (Select-String -Path package.json -Pattern '"version"' | ForEach-Object { $_.ToString().Replace('"version": ', '').Replace(',', '').Trim() })
          echo "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (!$(git tag -l "v$ver")) {
            git tag -a "v$ver" -m "Release $ver"
            git push origin "v$ver"
          }

      - name: Build Application
        run: npm run build

      - name: Build Installer (no publish yet)
        run: npx electron-builder --win --publish never

      - name: Upload latest.yml to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.tag.outputs.ver }}
          files: |
            release/latest.yml
            release/*Setup*.exe
            release/*Portable*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
