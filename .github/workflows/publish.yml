name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Get Version
        id: version
        run: |
          $ver = (Get-Content package.json | Select-String '"version"').ToString().Replace('"version": ', '').Replace(',', '').Trim()
          echo "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.ver }}" -m "Release ${{ steps.version.outputs.ver }}" || echo "Tag already exists"
          git push --tags

      - name: Build Application
        run: npm run build

      - name: Build & Publish Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
