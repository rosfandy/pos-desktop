name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Create Tag & Build + Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Extract version
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Version: $ver"

          # Buat & push git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$ver" -m "Release $ver" 2>$null
          git push origin "v$ver" 2>$null

          # Hapus SEMUA draft release + release lama (pakai gh CLI)
          Write-Host "=== Drafts ==="
          $draftIds = gh api "repos/rosfandy/pos-desktop/releases?per_page=100" --jq '.[] | select(.draft == true) | .id'
          foreach ($id in $draftIds) {
            Write-Host "Deleting draft release id=$id"
            gh api -X DELETE "repos/rosfandy/pos-desktop/releases/$id"
          }

          Write-Host "=== Old published releases ==="
          $oldTags = gh api "repos/rosfandy/pos-desktop/releases?per_page=100" --jq ".[] | select(.draft == false and .tag_name != `"v$ver`") | .tag_name"
          foreach ($tag in $oldTags) {
            Write-Host "Deleting release $tag"
            gh release delete $tag --yes --cleanup-tag
          }

          # Build & publish
          npx electron-builder --win --publish always
