name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Create Tag & Build + Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Extract version
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Version: $ver"

          # Buat & push git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$ver" -m "Release $ver" 2>$null
          git push origin "v$ver" 2>$null

          # Hapus SEMUA draft release + release lama supaya tidak ada asset stale
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/rosfandy/pos-desktop/releases?per_page=100" -Headers $headers
          foreach ($r in $releases) {
            if ($r.draft -or $r.tag_name -ne "v$ver") {
              try {
                Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/rosfandy/pos-desktop/releases/$($r.id)" -Headers $headers
                Write-Host "Deleted release: $($r.tag_name) (draft=$($r.draft))"
              } catch { Write-Host "Failed to delete $($r.tag_name)" }
            }
          }

          # Build & publish
          npx electron-builder --win --publish always
