name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 required for Electron 44)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Get Version & Create Tag
        id: version
        shell: pwsh
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          $ver = $json.version
          echo "Ver extracted: $ver"
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ($("${{ steps.version.outputs.tag }}") -and -not $(git tag -l "${{ steps.version.outputs.tag }}")) {
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          }

      - name: Build Application
        run: npm run build

      - name: Build Installer
        run: npx electron-builder --win --publish never

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            release/latest.yml
            release/*Setup*.exe
            release/*Portable*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
